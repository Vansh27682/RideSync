<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | RideSync</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>
<div class="auth-container">
    <div class="auth-card">
        <h1>RideSync</h1>
        <p class="subtitle">Campus Bike Rental System</p>
        <h2>Reset Password</h2>

        {% if success_message %}
        <p class="success-message">{{ success_message }}</p>
        {% if session.get('password_reset_challenge_id') %}
        <p class="switch-text">
            <a href="{{ url_for('verify_otp') }}">Enter verification code</a>
        </p>
        {% endif %}
        {% endif %}

        {% if message %}
        <p class="error-message">{{ message }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('forgot_password') }}">
            <label for="channel">Send code to</label>
            <select id="channel" name="channel" required>
                <option value="email">Registered email</option>
                <option value="phone">Registered mobile number</option>
            </select>

            <label for="identifier">Email or mobile number</label>
            <input
                type="text"
                id="identifier"
                name="identifier"
                placeholder="Email or Indian number (9876543210 or +919876543210)"
                required
            >

            <button type="submit">Send Verification Code</button>
        </form>

        <p class="switch-text">
            <a href="{{ url_for('login') }}">Back to login</a>
        </p>
    </div>
</div>
</body>

</html>
